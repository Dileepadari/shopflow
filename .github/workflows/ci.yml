name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python - lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        # Integration tests need a live cluster and are covered by the
        # integration job below.
        env:
          LOG_DIR: ${{ runner.temp }}/shopflow-logs
        run: pytest -m "not integration" --cov --cov-report=term-missing

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # Runtime dependencies only: these are what ship in the service images.
      # Nothing was checking them, and python-dotenv sat two minor versions
      # behind a symlink-following advisory in set_key/unset_key.
      - name: Known vulnerabilities in runtime dependencies
        run: |
          pip install --quiet pip-audit
          pip-audit --strict -r requirements.txt

  hygiene:
    name: Plain ASCII in prose and interface strings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Em dashes, en dashes, decorative arrows and dingbats. This started at
      # 116 occurrences across thirteen files, including ASCII diagrams in the
      # README where an arrow also broke column alignment when replaced.
      #
      # tests/unit/test_message_builder.py is exempt on purpose: its non-ASCII
      # is the subject of the test, which asserts that two, three and four byte
      # UTF-8 survives an encode/decode round trip.
      - name: No em dashes, arrows or dingbats
        run: |
          if git ls-files -z \
              ':!tests/unit/test_message_builder.py' \
              | xargs -0 grep -nP '[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{2190}-\x{21FF}\x{2014}\x{2013}\x{FE0F}]' \
                --binary-files=without-match; then
            echo "Found an em dash, en dash, arrow or dingbat. Use -, -> or plain words."
            exit 1
          fi
          echo "clean"

  readme-pair:
    name: README-light.md is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # README-light.md is generated, never hand-edited. Regenerate it and fail
      # if the committed copy differs, so the two pages cannot drift apart when
      # only one of them is updated.
      - name: Regenerate and compare
        run: |
          python3 scripts/build_light_readme.py
          git diff --exit-code README-light.md

      # An <img src> that points at a file nobody committed renders as a broken
      # image on github.com and nowhere else, so nothing else would catch it.
      - name: Every local image referenced by either README exists
        run: |
          missing=0
          for f in $(grep -ho 'src="[^"]*"' README.md README-light.md \
                     | sed 's/^src="//; s/"$//' | grep -v '^https\?://' | sort -u); do
            if [ ! -f "$f" ]; then
              echo "missing: $f"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "every referenced image exists"

  frontend:
    name: Frontend - lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx eslint .
      - run: npm run build

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Validate HAProxy config
        run: |
          docker run --rm -v "$PWD/infrastructure/haproxy:/cfg:ro" \
            haproxy:3.4-alpine haproxy -c -f /cfg/haproxy.cfg

  integration:
    name: Integration - full stack
    runs-on: ubuntu-latest
    # The 3-node cluster plus 20 containers is slow to start; keep it off the
    # critical path for pull requests from forks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          # HTTP readiness alone is not enough: the consumers subscribe a few
          # seconds after their containers start, so validate.sh would race them.
          # Wait until all 16 are actually consuming.
          for _ in $(seq 1 72); do
            if curl -sf http://localhost:8090/health >/dev/null \
               && curl -sf http://localhost:8080/health >/dev/null \
               && curl -sf http://localhost:3000/ >/dev/null; then
              consumers=$(curl -sf -u "${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-shopflow123}" \
                  http://localhost:15672/api/consumers/shopflow \
                  | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0)
              if [ "$consumers" -ge 16 ]; then
                echo "services ready, $consumers consumers subscribed"; exit 0
              fi
              echo "waiting: $consumers/16 consumers subscribed"
            fi
            sleep 5
          done
          echo "services did not become ready in time"
          docker compose ps
          exit 1

      - name: End-to-end validation
        run: ./scripts/validate.sh

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Container states"
          docker compose ps -a
          echo "::endgroup::"
          echo "::group::Container logs"
          docker compose logs --tail=100
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
