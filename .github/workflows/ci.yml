name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        # Integration tests need a live cluster and are covered by the
        # integration job below.
        env:
          LOG_DIR: ${{ runner.temp }}/shopflow-logs
        run: pytest -m "not integration" --cov --cov-report=term-missing

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx eslint .
      - run: npm run build

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Validate HAProxy config
        run: |
          docker run --rm -v "$PWD/infrastructure/haproxy:/cfg:ro" \
            haproxy:3.4-alpine haproxy -c -f /cfg/haproxy.cfg

  integration:
    name: Integration — full stack
    runs-on: ubuntu-latest
    # The 3-node cluster plus 20 containers is slow to start; keep it off the
    # critical path for pull requests from forks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8090/health >/dev/null \
               && curl -sf http://localhost:8080/health >/dev/null \
               && curl -sf http://localhost:3000/ >/dev/null; then
              echo "services ready"; exit 0
            fi
            sleep 5
          done
          echo "services did not become ready in time"; exit 1

      - name: End-to-end validation
        run: ./scripts/validate.sh

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
