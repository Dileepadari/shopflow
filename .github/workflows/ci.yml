name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        # Integration tests need a live cluster and are covered by the
        # integration job below.
        env:
          LOG_DIR: ${{ runner.temp }}/shopflow-logs
        run: pytest -m "not integration" --cov --cov-report=term-missing

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx eslint .
      - run: npm run build

  compose:
    name: Compose config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
      - name: Validate HAProxy config
        run: |
          docker run --rm -v "$PWD/infrastructure/haproxy:/cfg:ro" \
            haproxy:3.4-alpine haproxy -c -f /cfg/haproxy.cfg

  integration:
    name: Integration — full stack
    runs-on: ubuntu-latest
    # The 3-node cluster plus 20 containers is slow to start; keep it off the
    # critical path for pull requests from forks.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          # HTTP readiness alone is not enough: the consumers subscribe a few
          # seconds after their containers start, so validate.sh would race them.
          # Wait until all 16 are actually consuming.
          for _ in $(seq 1 72); do
            if curl -sf http://localhost:8090/health >/dev/null \
               && curl -sf http://localhost:8080/health >/dev/null \
               && curl -sf http://localhost:3000/ >/dev/null; then
              consumers=$(curl -sf -u "${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-shopflow123}" \
                  http://localhost:15672/api/consumers/shopflow \
                  | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0)
              if [ "$consumers" -ge 16 ]; then
                echo "services ready, $consumers consumers subscribed"; exit 0
              fi
              echo "waiting: $consumers/16 consumers subscribed"
            fi
            sleep 5
          done
          echo "services did not become ready in time"
          docker compose ps
          exit 1

      - name: End-to-end validation
        run: ./scripts/validate.sh

      - name: Integration tests
        run: pytest tests/integration -v

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Container states"
          docker compose ps -a
          echo "::endgroup::"
          echo "::group::Container logs"
          docker compose logs --tail=100
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
