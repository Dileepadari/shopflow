# ShopFlow dashboard - static SPA plus a reverse proxy to the backend services.
#
# Everything the browser calls is same-origin under /api/, so the dashboard works
# from any host. Previously the built bundle called http://localhost:8080 and
# http://localhost:8090 directly, which only worked when the browser happened to
# be on the Docker host - and the VITE_* variables meant to configure that were
# supplied as runtime env, which Vite cannot read (it inlines them at build time).

upstream chaos_api {
    server chaos_service:8080;
}

upstream producer_api {
    server producer_api:8090;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Chaos Control Panel: /api/chaos/status -> chaos_service:8080/chaos/status
    location /api/chaos/ {
        proxy_pass http://chaos_api/chaos/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Order publishing: /api/orders/publish -> producer_api:8090/orders/publish
    location /api/orders/ {
        proxy_pass http://producer_api/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # RabbitMQ Management, via the Producer API proxy which holds the
    # credentials and fails over between the three nodes.
    location /api/mgmt/ {
        proxy_pass http://producer_api/mgmt/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
