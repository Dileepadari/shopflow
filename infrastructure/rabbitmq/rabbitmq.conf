# ShopFlow - RabbitMQ configuration, mounted into all 3 nodes.
#
# Peer discovery via the config file is built into the core in RabbitMQ 4.x, so
# rabbitmq_peer_discovery_classic_config is no longer listed in enabled_plugins.
cluster_formation.peer_discovery_backend  = classic_config
cluster_formation.classic_config.nodes.1  = rabbit@rabbit1
cluster_formation.classic_config.nodes.2  = rabbit@rabbit2
cluster_formation.classic_config.nodes.3  = rabbit@rabbit3

listeners.tcp.default = 5672
management.tcp.port   = 15672

# Must stay at or above the pika client heartbeat (src/core/connection.py).
heartbeat = 30

vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.5

# Quorum queues are the only queue type this project declares (FR-10). Refusing
# to create classic queues keeps that true.
default_queue_type = quorum

log.console.level = info
log.file          = false
