global
    log stdout format raw local0 info

    # This stack opens a few dozen AMQP connections, not tens of thousands.
    # The previous `maxconn 50000` required an FD limit of ~100k, which exceeds
    # the 65536 hard limit on GitHub Actions runners and many container hosts -
    # HAProxy then refuses to start. fd-hard-limit keeps it from trying to raise
    # the limit beyond what the host allows.
    maxconn 4096
    fd-hard-limit 65536

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 10s
    timeout client  1m
    timeout server  1m

# Unified AMQP entrypoint. Every producer and consumer connects here rather than
# to a node directly, so a node failure is absorbed transparently.
frontend amqp_frontend
    bind *:5670
    default_backend amqp_cluster

backend amqp_cluster
    # leastconn suits long-lived AMQP connections better than roundrobin, which
    # only balances at connection time and so drifts as consumers reconnect.
    balance leastconn
    option tcp-check
    # 2s checks, 2 successes to mark UP, 2 failures to mark DOWN - fast enough
    # that stopping a node is visible on the dashboard within seconds.
    server rabbit1 172.20.0.11:5672 check inter 2s rise 2 fall 2
    server rabbit2 172.20.0.12:5672 check inter 2s rise 2 fall 2
    server rabbit3 172.20.0.13:5672 check inter 2s rise 2 fall 2

frontend stats
    bind *:8404
    mode http

    # Unauthenticated liveness endpoint for the container healthcheck.
    # /stats itself requires auth, so probing it would always get a 401.
    monitor-uri /healthz

    stats enable
    stats uri /stats
    stats refresh 5s
    # Follows RABBITMQ_USER/RABBITMQ_PASS like every other service. It was
    # pinned to the demo default, and haproxy had no environment block in
    # docker-compose.yml, so changing the password everywhere else left this
    # page still answering to the old one.
    #
    # The guard matters: an unset variable expands to an empty string, so
    # without it `stats auth ${RABBITMQ_USER}:${RABBITMQ_PASS}` would quietly
    # become `stats auth :` and publish the page with empty credentials.
    # Refusing to start is the safer failure.
.if !defined(RABBITMQ_PASS)
    .alert "RABBITMQ_PASS is not set; refusing to publish the stats page with an empty password."
.endif
.if !defined(RABBITMQ_USER)
    .alert "RABBITMQ_USER is not set; refusing to publish the stats page with an empty user."
.endif
    stats auth ${RABBITMQ_USER}:${RABBITMQ_PASS}
    stats show-legends
    stats show-node
