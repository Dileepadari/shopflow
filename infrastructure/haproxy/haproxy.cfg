global
    log stdout format raw local0 info
    maxconn 50000
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 10s
    timeout client  1m
    timeout server  1m

frontend amqp_frontend
    bind *:5670
    default_backend amqp_cluster

backend amqp_cluster
    balance roundrobin
    timeout connect 10s
    timeout server  1m
    option tcp-check
    option allbackups
    # Health checks: every 2s, 2 successes to mark UP, 2 failures to mark DOWN (faster recovery)
    server rabbit1 172.20.0.11:5672 check inter 2s rise 2 fall 2
    server rabbit2 172.20.0.12:5672 check inter 2s rise 2 fall 2
    server rabbit3 172.20.0.13:5672 check inter 2s rise 2 fall 2

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:shopflow123
    stats show-legends
    stats show-node
