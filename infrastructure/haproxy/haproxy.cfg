global
    log stdout format raw local0 info
    maxconn 50000

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 10s
    timeout client  1m
    timeout server  1m

# Unified AMQP entrypoint. Every producer and consumer connects here rather than
# to a node directly, so a node failure is absorbed transparently.
frontend amqp_frontend
    bind *:5670
    default_backend amqp_cluster

backend amqp_cluster
    # leastconn suits long-lived AMQP connections better than roundrobin, which
    # only balances at connection time and so drifts as consumers reconnect.
    balance leastconn
    option tcp-check
    # 2s checks, 2 successes to mark UP, 2 failures to mark DOWN - fast enough
    # that stopping a node is visible on the dashboard within seconds.
    server rabbit1 172.20.0.11:5672 check inter 2s rise 2 fall 2
    server rabbit2 172.20.0.12:5672 check inter 2s rise 2 fall 2
    server rabbit3 172.20.0.13:5672 check inter 2s rise 2 fall 2

frontend stats
    bind *:8404
    mode http

    # Unauthenticated liveness endpoint for the container healthcheck.
    # /stats itself requires auth, so probing it would always get a 401.
    monitor-uri /healthz

    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:shopflow123
    stats show-legends
    stats show-node
